# ---- HTTP em claro (porta 80): tudo legível pelo interceptador ----
server {
    listen 80 default_server;
    server_name _;
    location / {
        add_header Content-Type text/html;
        return 200 "<h1>$host</h1><p>HTTP em claro — metodo $request_method URI $request_uri</p>";
    }
}

# ---- HTTPS (porta 443): nomes virtuais distintos exercitam o SNI ----
server {
    listen 443 ssl default_server;
    server_name loja.lab banco.lab noticias.lab video.lab site-http.lab;
    ssl_certificate     /etc/nginx/lab.crt;
    ssl_certificate_key /etc/nginx/lab.key;
    location / {
        add_header Content-Type text/html;
        return 200 "<h1>$host</h1><p>HTTPS — conteudo cifrado; so o SNI vazou.</p>";
    }
}
